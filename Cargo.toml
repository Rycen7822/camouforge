[workspace]
resolver = "2"
members = ["crates/protocol", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
lto = "fat"
# panic hook（logs/panic.log）与 GPUI 的 catch_unwind 依赖栈展开，不要改 abort。
panic = "unwind"
